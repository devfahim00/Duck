name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Duck APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Chaquopy's chaquopy{} block (pip install, bytecode compilation) runs
      # ON THE BUILD MACHINE at Gradle time and needs a real Python whose
      # major.minor matches the app's chaquopy.defaultConfig.version (3.13).
      # It searches PATH for `python3.13` first - see buildPython in
      # https://chaquo.com/chaquopy/doc/current/android.html
      - name: Set up Python 3.13 (for Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK (arm64-v8a)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # APK asset naming MUST stay in sync with AppUpdater.apkUrlFor() in the
      # app: releases/download/<tag>/Duck-arm64-v8a-<tag>.apk
      - name: Rename APK
        run: |
          mkdir -p release-out
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="ci-${GITHUB_SHA::7}"
          fi
          cp "$apk" "release-out/Duck-arm64-v8a-${label}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duck-arm64-v8a-release-apk
          path: release-out/*.apk
          if-no-files-found: error

      # Pushing a v* tag publishes a GitHub Release with the signed APK and
      # the full changelog (RELEASE_NOTES.md). Branch pushes only verify the
      # build and upload the artifact.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Duck ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-out/*.apk
