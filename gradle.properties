# Project-wide Gradle settings for Duck
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Intentionally NOT parallel: with org.gradle.parallel=true, Chaquopy's
# python tasks racing Kotlin's lazy friendPathsSet property evaluation
# intermittently fails :app:compile*Kotlin with "Current thread does not
# hold the state lock for root project" (seen on both CI and local builds,
# Gradle 8.9 + KGP 2.0.21 + Chaquopy 17). This is a single-module app, so
# parallel task execution buys nothing anyway.
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
